<script>
const ago = (h) => new Date(Date.now() - h * 3600e3).toISOString();
const TICKETS = {
  160010: { title: 'Campaign emails stuck in "Processing" after update', status: 'active', opened: 22,
    content: '<p>Hi team,</p><p>After updating to the latest version, my scheduled campaign stays in "Processing" and only the first batch of recipients gets the email.</p><p>It happens only with dynamic segments. Static lists work fine.</p>',
    responses: [

      { content: 'Dev note: pagination cursor conflicts with segment ORDER BY. Linked to board task.', conversation_type: 'note', person: { full_name: 'Alex (Support)', person_type: 'agent' }, created_at: ago(19) },
      { content: '<p>Great, thank you! Happy to test a beta build.</p>', conversation_type: 'response', person: { full_name: 'Jane Doe', person_type: 'customer' }, created_at: ago(18) }

  177567: { title: 'Feature request: countdown timer block', status: 'closed', opened: 240, content: '<p>Would love a countdown timer block in the email builder.</p>', responses: [] }
};
const T = (id) => {
  const t = TICKETS[id];
  return { ok: true, data: { ticket: { id, title: t.title, status: t.status, priority: 'normal', product: { title: 'FluentCRM' }, tags: [{ title: 'bug' }],
    customer: { full_name: 'Jane Doe', email: 'jane@example.com' }, agent: { full_name: 'Alex' },
    created_at: ago(t.opened), updated_at: ago(t.opened > 100 ? 100 : 18), content: t.content }, responses: t.responses } };
};
window.chrome = {
  runtime: { sendMessage: async (m) => TICKETS[m.id] ? T(m.id) : { ok: false, error: 'No query results' } },
  storage: { local: { get: async (d) => d, set: async () => {} } }
};
</script>
